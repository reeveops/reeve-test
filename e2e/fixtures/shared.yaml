version: 1
config_type: shared
bucket:
  type: filesystem
  name: .reeve-state
locking:
  ttl: 1m
  queue: fifo
approvals:
  sources:
    - type: pr_review
      enabled: true
  default:
    required_approvals: 1
    approvers: ["reeve-e2e-reviewer[bot]", "reeve-e2e-author[bot]"]
    codeowners: false
    dismiss_on_new_commit: true
preconditions:
  require_up_to_date: true
  require_checks_passing: true
  preview_freshness: 1h
apply:
  trigger: comment
  allow_fork_prs: false
