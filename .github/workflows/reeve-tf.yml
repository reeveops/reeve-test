name: reeve-tf

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  statuses: write
  id-token: write

jobs:
  reeve:
    if: ${{ vars.REEVE_LIVE_DEMO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number)) || github.sha }}

      # The reeve action installs pulumi itself but not tofu.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_wrapper: false
          tofu_version: "1.12.6"

      - uses: reeveops/reeve@1847a83f6ec8cf4b6d9baa4054393f6666a51ad9
        with:
          root: tf
