name: drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  drift:
    if: ${{ vars.REEVE_LIVE_DEMO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: reeveops/reeve@1847a83f6ec8cf4b6d9baa4054393f6666a51ad9
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        with:
          command: "drift run"
          pulumi-version: "3.262.0"
