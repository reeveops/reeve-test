name: Start Reeve Playground

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: playground-start-${{ github.event.issue.user.login }}
  cancel-in-progress: false

jobs:
  start:
    if: >-
      github.repository == 'reeveops/reeve-test' &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR') &&
      startsWith(github.event.issue.title, '[Playground] ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Author identity
        id: author
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.E2E_AUTHOR_APP_ID }}
          private-key: ${{ secrets.E2E_AUTHOR_PRIVATE_KEY }}
          owner: reeveops
          repositories: reeve-test
          permission-contents: write
          permission-pull-requests: write

      - name: Create owned playground PR
        id: fixture
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ steps.author.outputs.token }}
          script: |
            const engines = {
              '[Playground] OpenTofu': 'opentofu',
              '[Playground] Terraform': 'terraform',
              '[Playground] Pulumi': 'pulumi'
            };
            const engine = engines[context.payload.issue.title];
            const confirmation = '- [x] I understand this creates a temporary playground pull request.';
            if (!engine || !context.payload.issue.body?.includes(confirmation)) {
              core.setFailed('The playground request is missing its required confirmation.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = `reeve-playground/${context.payload.issue.number}-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const selector = `playground/${engine}.yaml`;
            let created = false;
            try {
              const {data: base} = await github.rest.git.getRef({owner, repo, ref: 'heads/master'});
              await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: base.object.sha});
              created = true;
              const {data: source} = await github.rest.repos.getContent({owner, repo, path: selector, ref: 'master'});
              if (Array.isArray(source) || source.type !== 'file') throw new Error('Selector is not a file');
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: selector, branch, sha: source.sha,
                message: `test: enable ${engine} playground`,
                content: Buffer.from('enabled: true\n').toString('base64')
              });
              const {data: pr} = await github.rest.pulls.create({
                owner, repo, base: 'master', head: branch,
                title: `Reeve playground: ${engine}`,
                body: `<!-- reeve:playground-session:v1 -->\nRequested by @${context.payload.issue.user.login} from #${context.payload.issue.number}.\n\nFollow the guided progress comment. This PR is temporary and will close automatically.`
              });
              core.setOutput('engine', engine);
              core.setOutput('branch', branch);
              core.setOutput('pr', String(pr.number));
              core.setOutput('sha', pr.head.sha);
              core.setOutput('url', pr.html_url);
            } catch (error) {
              if (created) {
                try { await github.rest.git.deleteRef({owner, repo, ref: `heads/${branch}`}); } catch (_) {}
              }
              throw error;
            }

      - name: Label PR and close request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PLAYGROUND_ENGINE: ${{ steps.fixture.outputs.engine }}
          PLAYGROUND_PR: ${{ steps.fixture.outputs.pr }}
          PLAYGROUND_SHA: ${{ steps.fixture.outputs.sha }}
          PLAYGROUND_URL: ${{ steps.fixture.outputs.url }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = Number(process.env.PLAYGROUND_PR);
            if (!Number.isInteger(pr) || pr <= 0) throw new Error('Missing playground PR');
            try {
              await github.rest.issues.createLabel({owner, repo, name: 'reeve-playground', color: '8250df', description: 'Disposable guided Reeve playground'});
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.addLabels({owner, repo, issue_number: pr, labels: ['reeve-playground']});
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.payload.issue.number,
              body: `Your guided Reeve playground is ready: ${process.env.PLAYGROUND_URL}`
            });
            await github.rest.issues.update({owner, repo, issue_number: context.payload.issue.number, state: 'closed'});

      - name: Start guided session
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PLAYGROUND_ENGINE: ${{ steps.fixture.outputs.engine }}
          PLAYGROUND_PR: ${{ steps.fixture.outputs.pr }}
          PLAYGROUND_SHA: ${{ steps.fixture.outputs.sha }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'playground.yml', ref: 'master',
              inputs: {
                pr: process.env.PLAYGROUND_PR,
                engine: process.env.PLAYGROUND_ENGINE,
                head_sha: process.env.PLAYGROUND_SHA,
                session_owner: context.payload.issue.user.login
              }
            });

      - name: Remove failed launch
        if: failure() && steps.author.outcome == 'success' && steps.fixture.outputs.pr != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PLAYGROUND_PR: ${{ steps.fixture.outputs.pr }}
          PLAYGROUND_BRANCH: ${{ steps.fixture.outputs.branch }}
        with:
          github-token: ${{ steps.author.outputs.token }}
          script: |
            const pr = Number(process.env.PLAYGROUND_PR);
            if (Number.isInteger(pr) && pr > 0) {
              await github.rest.pulls.update({...context.repo, pull_number: pr, state: 'closed'});
            }
            const branch = process.env.PLAYGROUND_BRANCH;
            if (branch?.startsWith('reeve-playground/')) {
              try {
                await github.rest.git.deleteRef({...context.repo, ref: `heads/${branch}`});
              } catch (error) {
                if (error.status !== 404 && error.status !== 422) throw error;
              }
            }
