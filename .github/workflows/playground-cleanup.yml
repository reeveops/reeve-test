name: Cleanup Reeve Playgrounds

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: reeve-playground-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'reeveops/reeve-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted cleanup logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Author identity
        id: author
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.E2E_AUTHOR_APP_ID }}
          private-key: ${{ secrets.E2E_AUTHOR_PRIVATE_KEY }}
          owner: reeveops
          repositories: reeve-test
          permission-contents: write
          permission-pull-requests: write

      - name: Close and delete stranded sessions
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          AUTHOR_TOKEN: ${{ steps.author.outputs.token }}
        with:
          script: |
            core.setSecret(process.env.AUTHOR_TOKEN);
            const {cleanupPlaygrounds} = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/playground-cleanup.js`);
            await cleanupPlaygrounds({github, authorToken: process.env.AUTHOR_TOKEN, context, core});
