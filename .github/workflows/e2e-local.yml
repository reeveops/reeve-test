name: Local E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      reeve-ref:
        description: Reeve commit to test
        type: string
        default: "d31c814640689c2f2e1b0d02d2bc11a80a94faab"

permissions:
  contents: read

concurrency:
  group: e2e-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    if: >-
      github.event_name != 'pull_request' ||
      (!startsWith(github.head_ref, 'reeve-e2e/') && !startsWith(github.head_ref, 'reeve-playground/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout test fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout Reeve source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: reeveops/reeve
          ref: ${{ inputs.reeve-ref || 'd31c814640689c2f2e1b0d02d2bc11a80a94faab' }}
          path: .local/reeve-source
          persist-credentials: false

      - name: Install E2E tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
          mise_toml: |
            [tools]
            go = "1.26.6"
            opentofu = "1.12.6"
            pulumi = "3.262.0"
            terraform = "1.16.2"
            minio = "2025.10.15.17.29.55"
            "github:fsouza/fake-gcs-server" = "1.56.1"

      - name: Restore Go dependency and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: reeve-e2e-go-v2-${{ runner.os }}-${{ runner.arch }}-1.26.6-${{ hashFiles('.local/reeve-source/go.sum') }}
          restore-keys: |
            reeve-e2e-go-v2-${{ runner.os }}-${{ runner.arch }}-1.26.6-
            reeve-e2e-go-v1-${{ runner.os }}-${{ runner.arch }}-1.26.6-

      - name: Build Reeve
        run: mise exec -- go -C .local/reeve-source build -o bin/reeve ./cmd/reeve

      - name: Run local cloud blob contracts
        shell: bash
        run: |
          set -o pipefail
          mise exec -- bash e2e/run-local-blob-contracts.sh .local/reeve-source 2>&1 | tee local-blob-contracts.log

      - name: Run real CLI and engine scenarios
        run: mise exec -- go test -race -tags=e2e -count=1 -v ./e2e -args --reeve .local/reeve-source/bin/reeve --report-dir e2e-report

      - name: Save diagnostic reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-report/
            local-blob-contracts.log
          if-no-files-found: warn
          retention-days: 7
