name: Local E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      reeve-ref:
        description: Reeve commit to test
        type: string
        default: "0fc118139931fde27444ddc3d8527b16fbc381d5"

permissions:
  contents: read

concurrency:
  group: e2e-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'reeve-e2e/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout test fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout Reeve source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: reeveops/reeve
          ref: ${{ inputs.reeve-ref || '0fc118139931fde27444ddc3d8527b16fbc381d5' }}
          path: .local/reeve-source
          persist-credentials: false

      - name: Install E2E tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          cache_save: ${{ github.event_name != 'pull_request' }}
          mise_toml: |
            [tools]
            go = "1.26.6"
            opentofu = "1.12.6"
            pulumi = "3.262.0"

      - name: Build Reeve
        run: mise exec -- go -C .local/reeve-source build -o bin/reeve ./cmd/reeve

      - name: Run real CLI and engine scenarios
        run: mise exec -- go test -race -tags=e2e -count=1 -v ./e2e -args --reeve .local/reeve-source/bin/reeve --report-dir e2e-report

      - name: Save diagnostic reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-report/
          if-no-files-found: warn
          retention-days: 7
