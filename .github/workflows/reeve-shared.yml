name: Reeve Shared E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  merge_group:
    types: [checks_requested]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  reeve:
    uses: reeveops/reeve/.github/workflows/reeve.yml@6fb6d7b89abd0ed2ed71f788d38734ee92b02e9c
    with:
      mode: gitops
      root: tf
      opentofu_version: "1.12.6"
