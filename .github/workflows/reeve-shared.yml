name: Reeve Shared E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  reeve:
    uses: reeveops/reeve/.github/workflows/reeve.yml@77a84e50fc3ec76e808a295fe14df5d301f447bd
    with:
      mode: gitops
      root: tf
      opentofu_version: "1.12.6"
