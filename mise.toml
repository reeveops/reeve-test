[settings]
experimental = true

[tools]
go = "latest"
pulumi = "latest"
opentofu = "latest"
terraform = "latest"

[env]
# Matches the README one-time setup; any string works, it only encrypts
# the local passphrase-provider secrets.
PULUMI_CONFIG_PASSPHRASE = "reeve-test"
# Prefer the sibling repo's freshly built reeve over anything on PATH.
_.path = ["../reeve/bin"]

# ── setup ──────────────────────────────────────────────────────────────

[tasks.setup]
run = """
( cd ../reeve && go build -o bin/reeve ./cmd/reeve )
pulumi login file://./pulumi-state
go mod tidy
for p in random-name:dev random-name:prod random-secret:dev random-fail:dev; do
  proj="${p%%:*}"; stack="${p##*:}"
  ( cd "projects/$proj" && pulumi stack init "$stack" --secrets-provider=passphrase --non-interactive 2>/dev/null || true )
done
echo "setup complete - try: mise run lint"
"""
description = "One-time setup: build sibling reeve, local pulumi backend, init all stacks"

[tasks.reeve-build]
run = "( cd ../reeve && go build -o bin/reeve ./cmd/reeve )"
description = "Rebuild reeve from the sibling repo into ../reeve/bin"

[tasks."e2e:build"]
run = "mise -C ../reeve run build"
description = "Build the sibling Reeve checkout with its own pinned Go toolchain"

[tasks.e2e]
depends = ["e2e:build"]
tools = { opentofu = "1.12.6", pulumi = "3.262.0", terraform = "1.16.2" }
run = "go test -race -tags=e2e -count=1 -v ./e2e -args"
description = "Run disposable CLI E2E scenarios without GitHub or cloud credentials"

[tasks."e2e:run"]
tools = { opentofu = "1.12.6", pulumi = "3.262.0", terraform = "1.16.2" }
run = "go test -race -tags=e2e -count=1 -v ./e2e -args"
description = "Run E2E against an existing binary; accepts --reeve and --report-dir"

[tasks."cloud:fmt"]
tools = { opentofu = "1.12.6" }
run = "tofu fmt -recursive e2e/bootstrap"
description = "Format the disposable AWS and GCP contract infrastructure"

[tasks."cloud:validate"]
tools = { opentofu = "1.12.6" }
run = """
set -eu
for root in e2e/bootstrap/aws e2e/bootstrap/gcp; do
  tofu -chdir="$root" init -backend=false -input=false
  tofu -chdir="$root" validate
done
bash -n e2e/bootstrap/configure-github.sh
"""
description = "Initialize and validate the disposable cloud contract infrastructure"

[tasks."cloud:apply:aws"]
tools = { opentofu = "1.12.6" }
run = """
set -eu
: "${E2E_AWS_REGION:?set E2E_AWS_REGION}"
: "${E2E_S3_BUCKET:?set E2E_S3_BUCKET to a globally unique name}"
tofu -chdir=e2e/bootstrap/aws init -input=false
tofu -chdir=e2e/bootstrap/aws apply \
  -var="region=$E2E_AWS_REGION" \
  -var="bucket_name=$E2E_S3_BUCKET"
bash e2e/bootstrap/configure-github.sh aws "${E2E_GITHUB_REPOSITORY:-reeveops/reeve-test}"
"""
description = "Create the disposable AWS contract resources and configure GitHub variables"

[tasks."cloud:apply:gcp"]
tools = { opentofu = "1.12.6" }
run = """
set -eu
: "${E2E_GCP_PROJECT_ID:?set E2E_GCP_PROJECT_ID}"
: "${E2E_GCS_BUCKET:?set E2E_GCS_BUCKET to a globally unique name}"
tofu -chdir=e2e/bootstrap/gcp init -input=false
tofu -chdir=e2e/bootstrap/gcp apply \
  -var="project_id=$E2E_GCP_PROJECT_ID" \
  -var="bucket_name=$E2E_GCS_BUCKET"
bash e2e/bootstrap/configure-github.sh gcp "${E2E_GITHUB_REPOSITORY:-reeveops/reeve-test}"
"""
description = "Create the disposable GCP contract resources and configure GitHub variables"

[tasks."cloud:configure"]
tools = { opentofu = "1.12.6" }
run = "bash e2e/bootstrap/configure-github.sh \"${E2E_CLOUD_BACKEND:-all}\" \"${E2E_GITHUB_REPOSITORY:-reeveops/reeve-test}\""
description = "Refresh GitHub variables from existing AWS/GCP bootstrap outputs"

[tasks."cloud:run"]
run = """
gh workflow run cloud-blob-contract.yml \
  --repo "${E2E_GITHUB_REPOSITORY:-reeveops/reeve-test}" \
  -f backend="${E2E_CLOUD_BACKEND:-all}" \
  -f reeve-ref="${E2E_REEVE_REF:-d31c814640689c2f2e1b0d02d2bc11a80a94faab}"
"""
description = "Dispatch the configured real AWS/GCP blob contract"

[tasks."blob:s3-local"]
tools = { go = "1.26.6", minio = "2025.10.15.17.29.55" }
run = "bash e2e/run-local-s3-contract.sh"
description = "Run the Reeve S3 adapter contract against disposable local MinIO"

[tasks."blob:gcs-local"]
tools = { go = "1.26.6", "github:fsouza/fake-gcs-server" = "1.56.1" }
run = "bash e2e/run-local-gcs-contract.sh"
description = "Run the Reeve GCS adapter contract against a disposable local server"

[tasks."blob:local"]
tools = { go = "1.26.6", minio = "2025.10.15.17.29.55", "github:fsouza/fake-gcs-server" = "1.56.1" }
run = "bash e2e/run-local-blob-contracts.sh"
description = "Run the local S3 and GCS adapter contracts concurrently"

[tasks."e2e:scripts"]
run = """
bash -n e2e/run-local-blob-contracts.sh e2e/run-local-s3-contract.sh e2e/run-local-gcs-contract.sh e2e/bootstrap/configure-github.sh
node --test .github/scripts/*.test.js
"""
description = "Validate E2E shell scripts and playground lifecycle logic"

# ── reeve against the fixture ──────────────────────────────────────────

[tasks.lint]
run = "reeve lint"
description = "Validate the .reeve/ config with reeve's linter"

[tasks.stacks]
run = "reeve stacks"
description = "Enumerate the stacks reeve discovers"

[tasks.preview]
run = "reeve run preview --local"
description = "Local preview across all stacks (needs setup first)"

[tasks.locks]
run = "reeve locks list"
description = "List current stack locks"

[tasks.state]
run = "ls -R .reeve-state/ 2>/dev/null || echo 'no state yet - run a preview or apply first'"
description = "Inspect what reeve wrote to the filesystem bucket"

# ── reeve against the tf/ (OpenTofu) root ──────────────────────────────

[tasks.tf-lint]
run = "reeve lint"
dir = "tf"
description = "Validate the tf/.reeve/ config with reeve's linter"

[tasks.tf-stacks]
run = "reeve stacks"
dir = "tf"
description = "Enumerate the stacks reeve discovers in the tf root"

[tasks.tf-preview]
run = "reeve run preview --local"
dir = "tf"
description = "Local OpenTofu preview across the tf stacks"

# ── go maintenance ─────────────────────────────────────────────────────

[tasks.fmt]
run = "go fmt ./..."
description = "Format Go source"

[tasks.vet]
run = "go vet ./..."
description = "Run go vet across the projects"

[tasks.tidy]
run = "go mod tidy"
description = "Tidy go.mod / go.sum"

[tasks.update]
run = """
mise upgrade go
go get go@latest
go get toolchain@latest
go get -u ./...
go mod tidy
go vet ./...
"""
description = "Bump Go toolchain + all deps to latest, tidy, and vet"

[tasks.check]
depends = ["fmt", "vet", "lint", "stacks", "tf-lint", "tf-stacks", "e2e:scripts"]
description = "Format, vet, and validate both fixture roots - run before pushing"

# ── maintenance ────────────────────────────────────────────────────────

[tasks.clean]
run = "rm -rf .reeve-state/ pulumi-state/"
description = "Remove local reeve + pulumi state (fresh-start the fixture)"

# ── reeveops standard verb set ────────────────────────────────────────

[tasks.format]
depends = ["fmt"]
description = "Format Go source (alias for `fmt`)"
